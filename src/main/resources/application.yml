
server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


#Suggestion: Let's use environment variables for DB URL, username, and password.
#  It will improve security and allow every developer to run the project locally
#  without changing configuration files




