      enum: [MALE, FEMALE, Non_binary, Prefer_not_to_say]

    BloodGroup:
      type: string
      enum: [A_POSITIVE, A_NEGATIVE, B_POSITIVE, B_NEGATIVE, AB_POSITIVE, AB_NEGATIVE, O_POSITIVE, O_NEGATIVE]

    AppointmentStatus:
      type: string
      enum: [SCHEDULED, CANCELLED, COMPLETED, ON_HOLD]

    Shift:
      type: string
      enum: [MORNING_BeforeFood, MORNING_AfterFood, EVENING_BeforeFood, EVENING_AfterFood, NIGHT_BeforeFood, NIGHT_AfterFood]

    AllergyType:
      type: string
      enum: [DRUG, FOOD, ENVIRONMENTAL, INSECT, LATEX, OTHER]

    Severity:
      type: string
      enum: [MILD, MODERATE, SEVERE, LIFE_THREATENING]

    ReportAccessStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    RestrictionGrantStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
