          $ref: '#/components/schemas/DoctorProfile'
        maritalStatus:
          type: string
        emergencyContact:
          $ref: '#/components/schemas/Emergency'

    Address:
      type: object
      properties:
        addressLine:
          type: string
        state:
          type: string
        city:
          type: string
        pin_code:
          type: integer
          format: int64
          description: Postal code (length 6)

    Emergency:
      type: object
      properties:
        contactName:
          type: string
        contactPhoneNo:
          type: integer
          format: int64
          description: Contact phone number (length 10)
        relationship:
          type: string

    User:
      type: object
      properties:
        ehrId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        dob:
          type: string
          description: Date in mm-dd-yyyy format
        maritalStatus:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        phoneNo:
          type: integer
          format: int64
        gender:
          $ref: '#/components/schemas/Gender'
        address:
          $ref: '#/components/schemas/Address'
        emergencyContact:
          $ref: '#/components/schemas/Emergency'
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'

    # -----------------------------------------------------------------
    # Auth
    # -----------------------------------------------------------------
    AuthResponse:
      type: object
      properties:
        userResponseDTO:
          $ref: '#/components/schemas/UserResponseDTO'
        tokenResponse:
          $ref: '#/components/schemas/TokenResponse'

    AuthLoginResponse:
      type: object
      properties:
        loginResponse:
          $ref: '#/components/schemas/LoginResponse'
        tokenResponse:
          $ref: '#/components/schemas/TokenResponse'

    LoginRequest:
      type: object
      properties:
        email:
          type: string
