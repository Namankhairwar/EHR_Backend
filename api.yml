          example: 07-09-1990
        password:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        phoneNo:
          type: integer
          format: int64
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'
        gender:
          $ref: '#/components/schemas/Gender'
        emergencyContact:
          $ref: '#/components/schemas/Emergency'
        doctorProfile:
          $ref: '#/components/schemas/DoctorProfile'
        maritalStatus:
          type: string

    UserResponseDTO:
      type: object
      properties:
        email:
          type: string
        ehrId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phoneNo:
          type: integer
          format: int64
        dob:
          type: string
          description: Date in mm-dd-yyyy format
          example: 07-09-1990
        gender:
          $ref: '#/components/schemas/Gender'
        role:
          $ref: '#/components/schemas/Role'
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'
        address:
          $ref: '#/components/schemas/Address'
