          type: integer
          format: int64
        total_seat:
          type: integer
          format: int64
        available_seat:
          type: integer
          format: int64

    AppointmentResponseDTO:
      type: object
      properties:
        token:
          type: integer
          format: int64
        patientId:
          type: string
        doctorId:
          type: string
        date:
          type: string
          example: 07-20-2026
        startTime:
          type: string
          example: "14:30:00"
        lastTime:
          type: string
          example: "15:00:00"
        charge:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        total_seat:
          type: integer
          format: int64
        available_seat:
          type: integer
          format: int64

    # -----------------------------------------------------------------
    # Patient Allergies
    # -----------------------------------------------------------------
    AllergyRequestDTO:
      type: object
      properties:
        category:
