        doctorId:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        date:
          type: string
          description: Date in mm-dd-yyyy format
          example: 07-20-2026
        startTime:
          type: string
          description: Time in HH:mm:ss format
          example: "14:30:00"
        lastTime:
          type: string
          description: Time in HH:mm:ss format
          example: "15:00:00"
