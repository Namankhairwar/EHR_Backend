          type: string

    AllergyResponseDTO:
      type: object
      properties:
        allergyid:
          type: integer
          format: int64
        category:
          type: string
        items:
          type: string
        allergyType:
          $ref: '#/components/schemas/AllergyType'
        severity:
          $ref: '#/components/schemas/Severity'
        description:
