          format: int64
        prescribedBy:
          type: string
          description: Doctor ID (ehrId)
        prescribedOn:
          type: string
          description: Date in mm-dd-yyyy format
        details:
          type: array
          items:
            $ref: '#/components/schemas/MedicineDetails'
        patient:
          type: string
          description: Patient ID (ehrId)
        diet:
          $ref: '#/components/schemas/DietInstruction'

    MedicationDietRequest:
      type: object
      properties:
        name_of_diet:
          type: string
        food_description:
          type: string

    # -----------------------------------------------------------------
    # Diet Instructions
    # -----------------------------------------------------------------
    DietInstruction:
      type: object
